<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect the Dots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica', Arial, sans-serif;
            background: white;
            margin: 0;
            padding: 0;
        }

        .container {
            position: relative;
            width: 100vw;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 68.36%; /* Maintains aspect ratio: (364.8/533.8) * 100 */
        }

        .dots-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #231f20;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .dot:hover {
            opacity: 0.5;
        }

        .dot.hidden {
            display: none;
        }

        .dot-number {
            position: absolute;
            font-size: 10px;
            color: #231f20;
            white-space: nowrap;
            user-select: none;
            transform: translate(-50%, -120%);
            pointer-events: none;
        }
    </style>
</head>

        function initializeDots() {
            const container = document.getElementById('dotsContainer');
            
            dotsData.dots.forEach((dot, index) => {
                const dotEl = document.createElement('div');
                dotEl.className = 'dot';
                
                // Calculate percentage positions
                const leftPercent = (dot.x / 533.8) * 100;
                const topPercent = (dot.y / 364.8) * 100;
                
                dotEl.style.left = leftPercent + '%';
                dotEl.style.top = topPercent + '%';
                
                // Create number label
                const numberEl = document.createElement('span');
                numberEl.className = 'dot-number';
                numberEl.textContent = dot.number;
                
                dotEl.appendChild(numberEl);
                
                // Add click handler to hide the dot
                dotEl.addEventListener('click', function() {
                    this.classList.add('hidden');
                });
                
                container.appendChild(dotEl);
            });
        }

        window.onload = initializeDots;
