<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" href="links_style.css">
  <title>Image Sources</title>
</head>
<body>
<ul id="image-list"></ul>

<script>
  // fetch the page that contains your blog posts
  fetch('index.html')
    .then(res => res.text())
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      const images = doc.querySelectorAll('img');
      const list = document.getElementById('image-list');

      images.forEach(img => {
        const li = document.createElement('li');
        const a = document.createElement('a');

        a.href = img.src;
        a.textContent = img.src;

        li.appendChild(a);
        list.appendChild(li);
      });
    });
</script>

</body>
</html>
